<style>
    :root {
        --green: #00ff88;
        --green2: #00ffaa;
        --bg: #0b0b0b;
        --card: #111;
        --border: #222;
        --red: #ff4444;

    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: var(--bg);
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        min-height: 100vh;
    }

    /* HEADER */
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 30px;
        border-bottom: 1px solid #1a1a1a;

    header h1 {
        color: var(--green);

        font-weight: 900;
        letter-spacing: 4px;

    #relogioHeader {
        font-size: 13px;
        color: #555;
        font-weight: 500;
        letter-spacing: 1px;
    }

    /* LAYOUT PRINCIPAL */
    .main-layout {
        display: flex;
        gap: 0;
        min-height: calc(100vh - 61px);

    /* SIDEBAR */
    .sidebar {
        width: 280px;

    .sidebar-title {
        font-size: 11px;

    /* CARD TOTAL HOJE */
    .card-hoje {
        background: linear-gradient(135deg, #0f1f14, #0a1a10);

    .card-hoje-label {
        font-size: 10px;

    .bank-row {
        display: flex;

    .bank-row:last-child { border-bottom: none; }

    .bank-dot {

    /* DIAS NA SIDEBAR */
    .sidebar-dias-titulo {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #444;
        text-transform: uppercase;
        margin: 20px 0 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #1a1a1a;
    }

    .dia-card {
        background: #111;
        border: 1px solid #1a1a1a;

        padding: 12px 14px;

    .dia-card-data {
        font-size: 12px;

    }

    .dia-card-total {
        font-size: 18px;
        font-weight: 900;
        color: #fff;
    }

    .dia-card-qtd {
        font-size: 10px;
        color: #444;
        margin-top: 2px;
    }

    /* CONTEÚDO PRINCIPAL */
    .content {
        flex: 1;
        padding: 25px 30px;
        overflow-y: auto;
    }

    /* FORMULÁRIO */
    .form-card {
        background: var(--card);
        border: 1px solid #1a1a1a;
        border-radius: 14px;
        padding: 20px 25px;
        margin-bottom: 30px;
    }

    .form-card-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #444;
        text-transform: uppercase;
        margin-bottom: 15px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
        align-items: end;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .form-group label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #444;
        text-transform: uppercase;
    }

    input, select {
        padding: 11px 14px;
        background: #0d0d0d;
        border: 1px solid #222;
        color: #fff;
        border-radius: 8px;
        font-family: 'Montserrat';
        font-size: 13px;
        font-weight: 500;
        width: 100%;
        transition: border-color 0.2s;
        text-transform: uppercase;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--green);

    input[disabled] {
        color: var(--green);
        font-weight: 700;
        border-color: #1a3a2a;
        background: #0a1a10;
        cursor: default;
    }

    select option { background: #111; }

    .btn-green {
        background: var(--green);
        color: #000;
        font-weight: 800;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 11px 20px;
        font-family: 'Montserrat';
        font-size: 13px;
        letter-spacing: 1px;
        transition: all 0.2s;
        width: 100%;
    }

    .btn-green:hover {
        background: var(--green2);
        transform: translateY(-1px);
        box-shadow: 0 4px 20px #00ff8833;
    }

    .btn-export {
        background: transparent;
        color: var(--green);
        border: 1px solid var(--green);
    }

    .btn-export:hover {
        background: #0f2a1a;
    }

    /* STATUS PAGO */
    .status-pago {
        display: inline-block;
        background: #0a2a15;
        color: var(--green);
        border: 1px solid #1a5a2a;
        border-radius: 5px;
        padding: 3px 10px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
    }

    /* TABELAS */
    .dia-bloco { margin-bottom: 35px; }

    .dia-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .dia-titulo {
        font-size: 13px;
        font-weight: 700;
        color: var(--green2);
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .dia-total-badge {
        background: #0f1f14;
        border: 1px solid #1a3a2a;
        color: var(--green);
        font-size: 14px;
        font-weight: 800;
        padding: 5px 14px;
        border-radius: 20px;
    }

    .tabela-bloco {
        background: var(--card);
        border: 1px solid #1a1a1a;
        border-radius: 12px;
        overflow: hidden;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }

    th, td {
        border-bottom: 1px solid #161616;
        padding: 12px 14px;
        text-align: center;
        font-size: 12px;
    }

    th {
        background: #0d0d0d;
        color: #444;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 10px;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #141414; }

    .btn-del {
        cursor: pointer;
        color: #ff4444;
        font-weight: bold;
        font-size: 14px;
        transition: transform 0.2s;
        display: inline-block;
    }
    .btn-del:hover { transform: scale(1.3); }

    .bank-tag {
        padding: 4px 10px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: 700;
        display: inline-block;
        letter-spacing: 1px;
    }

    .nubank { background: #2a0a4a; color: #c77dff; border: 1px solid #820ad155; }
    .bradesco { background: #3a0a0a; color: #ff6b6b; border: 1px solid #ff3b3b55; }
    .mercadopago { background: #0a1a3a; color: #4db8ff; border: 1px solid #0097ff55; }
    .caixa { background: #2a2200; color: #ffdd00; border: 1px solid #ffdd0055; }

    /* HORA AUTOMÁTICA */
    .hora-auto {
        font-size: 11px;
        color: #333;
        text-align: center;
        margin-top: 8px;
    }

    .hora-auto span { color: var(--green); font-weight: 700; }

    /* VAZIO */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #333;
    }
    .empty-state div { font-size: 40px; margin-bottom: 10px; }
    .empty-state p { font-size: 13px; letter-spacing: 2px; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0d0d0d; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
</style>

<body>

<header>
    <h1>⚡ FINALERR</h1>
    <div id="relogioHeader">30/04/2026 20:10:23</div>
</header>

<div class="main-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-title">Resumo de Hoje</div>

        <div class="card-hoje">
            <div class="card-hoje-label">Total recebido hoje</div>
            <div id="totalHoje" class="card-hoje-valor">R$ 0.00</div>
            <div id="dataHojeLabel" class="card-hoje-data">30/04/2026</div>
        </div>

        <div style="background:#111; border:1px solid #1a1a1a; border-radius:10px; padding:12px;">
            <div class="bank-row">
                <span><span class="bank-dot" style="background:#820ad1"></span>Nubank</span>
                <span id="totalNubank" style="color:#c77dff; font-weight:700;">R$ 0.00</span>
            </div>
            <div class="bank-row">
                <span><span class="bank-dot" style="background:#ff3b3b"></span>Bradesco</span>
                <span id="totalBradesco" style="color:#ff6b6b; font-weight:700;">R$ 0.00</span>
            </div>
            <div class="bank-row">
                <span><span class="bank-dot" style="background:#0097ff"></span>Mercado Pago</span>
                <span id="totalMP" style="color:#4db8ff; font-weight:700;">R$ 0.00</span>
            </div>
            <div class="bank-row">
                <span><span class="bank-dot" style="background:#ffdd00"></span>Caixa</span>
                <span id="totalCaixa" style="color:#ffdd00; font-weight:700;">R$ 0.00</span>
            </div>
        </div>

        <div class="sidebar-dias-titulo">Total por Dia</div>
        <div id="diasSidebar"></div>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <!-- FORMULÁRIO -->
        <div class="form-card">
            <div class="form-card-title">✦ Novo Lançamento</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Data &amp; Hora</label>
                    <input type="text" id="dataHoraAuto" disabled="" placeholder="Automático">
                </div>
                <div class="form-group">
                    <label>Cliente</label>
                    <input type="text" id="cliente" placeholder="Nome do cliente" oninput="this.value=this.value.toUpperCase()">
                </div>
                <div class="form-group">
                    <label>Valor</label>
                    <input type="number" step="0.01" id="valor" placeholder="0,00">
                </div>
                <div class="form-group">
                    <label>Método</label>
                    <input type="text" id="metodo" placeholder="PIX / TED..." oninput="this.value=this.value.toUpperCase()">
                </div>
                <div class="form-group">
                    <label>Nome do PIX</label>
                    <input type="text" id="pix" placeholder="Nome do PIX" oninput="this.value=this.value.toUpperCase()">
                </div>
                <div class="form-group">
                    <label>Banco</label>
                    <select id="banco">
                        <option value="">Selecione</option>
                        <option value="nubank">NUBANK</option>
                        <option value="bradesco">BRADESCO</option>
                        <option value="mercadopago">MERCADO PAGO</option>
                        <option value="caixa">CAIXA ECONÔMICA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <input type="text" value="PAGO" disabled="" style="color:var(--green);font-weight:700;border-color:#1a3a2a;background:#0a1a10;">
                </div>
                <div class="form-group" style="display:flex;flex-direction:column;gap:8px;">
                    <button class="btn-green" onclick="adicionar()">+ ADICIONAR</button>
                    <button class="btn-green btn-export" onclick="baixarCSV()">↓ EXPORTAR</button>
                </div>
            </div>
            <div class="hora-auto">Data e hora capturadas automaticamente: <span id="horaPreview">30/04/2026 20:10:23</span></div>
        </div>

        <!-- TABELAS -->
        <div id="diasContainer"><div class="empty-state"><div>📋</div><p>Nenhum lançamento ainda</p></div></div>

    </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAc8LtGdC9zSYNy3FR9OvsXUBgiQUEh6yg",
    authDomain: "finalerr-cbb3f.firebaseapp.com",
    projectId: "finalerr-cbb3f",
    storageBucket: "finalerr-cbb3f.firebasestorage.app",
    messagingSenderId: "827118989747",
    appId: "1:827118989747:web:0cd19bf7fbfc161afe5bc6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colecao = collection(db, "lancamentos");

let dados = [];

// Carregar dados em tempo real
onSnapshot(query(colecao, orderBy("timestamp", "desc")), (snapshot) => {
    dados = [];
    snapshot.forEach(d => dados.push({ id: d.id, ...d.data() }));
    atualizarTabela();
});

function mostrarStatus(msg, tipo) {
    let el = document.getElementById("statusMsg");
    if (!el) {
        el = document.createElement("div");
        el.id = "statusMsg";
        el.style.cssText = "position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:700;z-index:9999;font-family:Montserrat,sans-serif;";
        document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.background = tipo === "ok" ? "#00ff88" : "#ff4444";
    el.style.color = tipo === "ok" ? "#000" : "#fff";
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 3000);
}

// RELÓGIO
function atualizarRelogio() {
    const agora = new Date();
    const pad = n => String(n).padStart(2, '0');
    const dataStr = `${pad(agora.getDate())}/${pad(agora.getMonth()+1)}/${agora.getFullYear()}`;
    const horaStr = `${pad(agora.getHours())}:${pad(agora.getMinutes())}:${pad(agora.getSeconds())}`;
    const full = `${dataStr} ${horaStr}`;
    document.getElementById("relogioHeader").textContent = full;
    document.getElementById("dataHoraAuto").value = full;
    document.getElementById("horaPreview").textContent = full;
    document.getElementById("dataHojeLabel").textContent = dataStr;
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

function bancoTag(nome) {
    if (nome === "nubank") return '<span class="bank-tag nubank">NUBANK</span>';
    if (nome === "bradesco") return '<span class="bank-tag bradesco">BRADESCO</span>';
    if (nome === "mercadopago") return '<span class="bank-tag mercadopago">MERCADO PAGO</span>';
    if (nome === "caixa") return '<span class="bank-tag caixa">CAIXA</span>';
    return nome || '-';
}

function agruparPorData() {
    let grupos = {};
    dados.forEach(item => {
        const dia = item.dataCompleta ? item.dataCompleta.split(' ')[0] : item.data;
        if (!grupos[dia]) grupos[dia] = [];
        grupos[dia].push(item);
    });
    return grupos;
}

function atualizarTabela() {
    const container = document.getElementById("diasContainer");
    const sidebar = document.getElementById("diasSidebar");

    if (dados.length === 0) {
        container.innerHTML = `<div class="empty-state"><div>📋</div><p>Nenhum lançamento ainda</p></div>`;
        sidebar.innerHTML = '';
        calcularTotalHoje();
        return;
    }

    container.innerHTML = "";
    sidebar.innerHTML = "";

    const grupos = agruparPorData();
    const datasOrdenadas = Object.keys(grupos).sort((a, b) => {
        const parseData = d => {
            if (d.includes('/')) {
                const [dd, mm, yyyy] = d.split('/');
                return new Date(`${yyyy}-${mm}-${dd}`);
            }
            return new Date(d);
        };
        return parseData(b) - parseData(a);
    });

    datasOrdenadas.forEach(dia => {
        const lista = grupos[dia];
        let totalDia = lista.reduce((sum, i) => sum + parseFloat(i.valor || 0), 0);

        const sideCard = document.createElement("div");
        sideCard.className = "dia-card";
        sideCard.innerHTML = `
            <div class="dia-card-data">${dia}</div>
            <div class="dia-card-total">R$ ${totalDia.toFixed(2)}</div>
            <div class="dia-card-qtd">${lista.length} lançamento${lista.length !== 1 ? 's' : ''}</div>
        `;
        sideCard.onclick = () => {
            document.getElementById('bloco-' + dia.replace(/\//g, '-'))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        sidebar.appendChild(sideCard);

        let bloco = document.createElement("div");
        bloco.className = "dia-bloco";
        bloco.id = 'bloco-' + dia.replace(/\//g, '-');

        let rows = '';
        lista.forEach(item => {
            rows += `
                <tr>
                    <td>${item.dataCompleta || item.data}</td>
                    <td style="font-weight:600;">${item.cliente}</td>
                    <td style="color:var(--green);font-weight:700;">R$ ${parseFloat(item.valor).toFixed(2)}</td>
                    <td>${item.metodo}</td>
                    <td>${item.pix}</td>
                    <td>${bancoTag(item.banco)}</td>
                    <td><span class="status-pago">PAGO</span></td>
                    <td><span class="btn-del" onclick="window.removerLinha('${item.id}')">✕</span></td>
                </tr>
            `;
        });

        bloco.innerHTML = `
            <div class="dia-header">
                <div class="dia-titulo">📅 ${dia}</div>
                <div class="dia-total-badge">R$ ${totalDia.toFixed(2)}</div>
            </div>
            <div class="tabela-bloco">
                <table>
                    <thead>
                        <tr>
                            <th>Data/Hora</th><th>Cliente</th><th>Valor</th>
                            <th>Método</th><th>PIX</th><th>Banco</th><th>Status</th><th>Del</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
        container.appendChild(bloco);
    });

    calcularTotalHoje();
}

window.removerLinha = async function(id) {
    if (confirm("Remover este lançamento?")) {
        try {
            await deleteDoc(doc(db, "lancamentos", id));
            mostrarStatus("Removido!", "ok");
        } catch(e) {
            mostrarStatus("Erro ao remover!", "erro");
        }
    }
}

window.adicionar = async function() {
    const cliente = document.getElementById("cliente").value.trim();
    const valor = document.getElementById("valor").value;
    const metodo = document.getElementById("metodo").value.trim();
    const pix = document.getElementById("pix").value.trim();
    const banco = document.getElementById("banco").value;

    if (!cliente || !valor || !metodo || !pix || !banco) {
        alert("Preencha todos os campos!");
        return;
    }

    const agora = new Date();
    const pad = n => String(n).padStart(2, '0');
    const dataCompleta = `${pad(agora.getDate())}/${pad(agora.getMonth()+1)}/${agora.getFullYear()} ${pad(agora.getHours())}:${pad(agora.getMinutes())}:${pad(agora.getSeconds())}`;

    const btnAdd = document.querySelector(".btn-green");
    btnAdd.textContent = "SALVANDO...";
    btnAdd.disabled = true;

    try {
        await addDoc(colecao, {
            dataCompleta,
            data: `${pad(agora.getDate())}/${pad(agora.getMonth()+1)}/${agora.getFullYear()}`,
            cliente, valor: parseFloat(valor), metodo, pix, banco,
            status: "PAGO",
            timestamp: serverTimestamp()
        });

        document.getElementById("cliente").value = '';
        document.getElementById("valor").value = '';
        document.getElementById("metodo").value = '';
        document.getElementById("pix").value = '';
        document.getElementById("banco").value = '';
        mostrarStatus("✓ Salvo na nuvem!", "ok");
    } catch(e) {
        mostrarStatus("Erro ao salvar! Verifique a conexão.", "erro");
    }

    btnAdd.textContent = "+ ADICIONAR";
    btnAdd.disabled = false;
}

function calcularTotalHoje() {
    const hoje = new Date();
    const pad = n => String(n).padStart(2, '0');
    const hojeStr = `${pad(hoje.getDate())}/${pad(hoje.getMonth()+1)}/${hoje.getFullYear()}`;

    let total = 0, brad = 0, nu = 0, mp = 0, cx = 0;
    dados.forEach(item => {
        const diaItem = item.dataCompleta ? item.dataCompleta.split(' ')[0] : item.data;
        if (diaItem === hojeStr) {
            const v = parseFloat(item.valor || 0);
            total += v;
            if (item.banco === "bradesco") brad += v;
            if (item.banco === "nubank") nu += v;
            if (item.banco === "mercadopago") mp += v;
            if (item.banco === "caixa") cx += v;
        }
    });

    document.getElementById("totalHoje").textContent = "R$ " + total.toFixed(2);
    document.getElementById("totalBradesco").textContent = "R$ " + brad.toFixed(2);
    document.getElementById("totalNubank").textContent = "R$ " + nu.toFixed(2);
    document.getElementById("totalMP").textContent = "R$ " + mp.toFixed(2);
    document.getElementById("totalCaixa").textContent = "R$ " + cx.toFixed(2);
}

window.baixarCSV = function() {
    if (dados.length === 0) { alert("Não há dados para exportar."); return; }
    let csv = "DATA/HORA,CLIENTE,VALOR,MÉTODO,PIX,BANCO,STATUS\n";
    dados.forEach(item => {
        csv += `"${item.dataCompleta || item.data}","${item.cliente}","${parseFloat(item.valor).toFixed(2)}","${item.metodo}","${item.pix}","${item.banco}","PAGO"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "finalerr_export.csv"; a.click();
}
</script>
